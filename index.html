<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Performance Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef1f4; --card:#ffffff; --sunk:#f6f8f9;
  --ink:#16222b; --ink-2:#3c4d59; --mute:#6b7f8c; --line:#d9e1e6; --line-2:#eaeff2;
  --accent:#0d5f60; --accent-ink:#ffffff; --accent-soft:#dfeceb; --accent-line:#a8cbc9;
  --gold:#a8720f; --gold-soft:#f7ecd8;
  --l5:#155e45; --l4:#2c7f63; --l3:#2f6f96; --l2:#a9701a; --l1:#a33a3a;
  --l5-bg:#dfeee7; --l4-bg:#e4f0ea; --l3-bg:#e1ecf3; --l2-bg:#f7ecd8; --l1-bg:#f6e2e2;
  --nav-bg:#0f1c23; --nav-line:#1f3039; --nav-ink:#b9ccd5; --nav-ink-2:#6f8895; --nav-active:#173039;
  --shadow:0 1px 2px rgba(18,35,44,.06), 0 8px 24px -16px rgba(18,35,44,.35);
  --r:10px;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0b1216; --card:#111b21; --sunk:#0e171c;
    --ink:#e3edf1; --ink-2:#b4c6ce; --mute:#8099a5; --line:#22333b; --line-2:#1a282f;
    --accent:#4ab5ad; --accent-ink:#06211f; --accent-soft:#122e2f; --accent-line:#27544f;
    --gold:#d3a04a; --gold-soft:#2b2312;
    --l5:#5fc79b; --l4:#63bf9e; --l3:#6fb2d8; --l2:#d9a85c; --l1:#e08585;
    --l5-bg:#122e24; --l4-bg:#132a23; --l3-bg:#132632; --l2-bg:#2b2312; --l1-bg:#2e1a1a;
    --nav-bg:#080f13; --nav-line:#16242b; --nav-ink:#a9bfc9; --nav-ink-2:#63808d; --nav-active:#132630;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0b1216; --card:#111b21; --sunk:#0e171c;
  --ink:#e3edf1; --ink-2:#b4c6ce; --mute:#8099a5; --line:#22333b; --line-2:#1a282f;
  --accent:#4ab5ad; --accent-ink:#06211f; --accent-soft:#122e2f; --accent-line:#27544f;
  --gold:#d3a04a; --gold-soft:#2b2312;
  --l5:#5fc79b; --l4:#63bf9e; --l3:#6fb2d8; --l2:#d9a85c; --l1:#e08585;
  --l5-bg:#122e24; --l4-bg:#132a23; --l3-bg:#132632; --l2-bg:#2b2312; --l1-bg:#2e1a1a;
  --nav-bg:#080f13; --nav-line:#16242b; --nav-ink:#a9bfc9; --nav-ink-2:#63808d; --nav-active:#132630;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size:15px; line-height:1.5; font-feature-settings:"tnum" 1,"cv05" 1;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.01em}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0 0 .6em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}

/* ---------- shell ---------- */
.app{display:grid; grid-template-columns:232px 1fr; min-height:100vh}
.nav{background:var(--nav-bg); color:var(--nav-ink); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto}
.brand{padding:18px 18px 16px; border-bottom:1px solid var(--nav-line)}
.brand .mark{display:flex; align-items:center; gap:10px}
.brand .logo{width:36px; height:36px; border-radius:50%; flex:0 0 auto; background:#fff; display:block}
.brand .nm{font-size:13.5px; color:#fff; font-weight:600; letter-spacing:.01em; line-height:1.25}
.brand .sub{font-size:11.5px; color:var(--nav-ink-2); margin-top:8px}
.navlist{padding:10px 10px 24px; display:flex; flex-direction:column; gap:1px}
.navsec{font-size:10.5px; color:var(--nav-ink-2); padding:14px 10px 6px; letter-spacing:.06em}
.navlist a{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:0;
  color:var(--nav-ink); padding:8px 10px; border-radius:7px; cursor:pointer; font-size:13.5px;
  text-decoration:none;
}
.navlist a:hover{background:var(--nav-active); color:#fff}
.navlist a[aria-current="page"]{background:var(--nav-active); color:#fff; font-weight:600; box-shadow:inset 2px 0 0 var(--accent)}
.navlist .ic{width:16px; text-align:center; opacity:.85; font-size:13px}
.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:center; gap:14px; padding:12px 24px; background:var(--card);
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; flex-wrap:wrap;
}
.topbar .crumb{font-size:13px; color:var(--mute); flex:1; min-width:120px}
.topbar .crumb b{color:var(--ink); font-weight:600}
.who{display:flex; align-items:center; gap:8px}
.who select{max-width:210px}
.content{padding:22px 24px 64px; max-width:1180px; width:100%}
.mobile-nav{display:none}
.login-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--nav-bg); padding:24px}
.login-card{width:100%; max-width:380px; background:var(--card); border-radius:12px; border:1px solid var(--line); box-shadow:0 24px 60px -20px rgba(0,0,0,.5); padding:28px 26px}
.login-card .mark{display:flex; align-items:baseline; gap:9px; margin-bottom:4px}
.login-card .dial{font-family:"Newsreader",Georgia,serif; font-size:28px; color:var(--accent); line-height:1}
.login-card h1{font-size:1.15rem}
.login-card .sub{color:var(--mute); font-size:12.5px; margin:2px 0 20px}
.login-card .err{margin-bottom:14px}

/* ---------- primitives ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card-h{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line-2); flex-wrap:wrap}
.card-h h2,.card-h h3{flex:1; min-width:140px}
.card-b{padding:16px}
.card-b.tight{padding:0}
.hint{color:var(--mute); font-size:13px}
.pagehead{display:flex; align-items:flex-end; gap:16px; margin-bottom:18px; flex-wrap:wrap}
.pagehead .t{flex:1; min-width:220px}
.pagehead h1{font-family:"Newsreader",Georgia,serif; font-weight:500; font-size:1.75rem; letter-spacing:-.015em}
.pagehead p{margin:4px 0 0; color:var(--mute); font-size:13.5px; max-width:66ch}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.spacer{flex:1}

.btn{
  display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--card);
  color:var(--ink); padding:7px 13px; border-radius:7px; cursor:pointer; font-size:13.5px; font-weight:500;
}
.btn:hover{border-color:var(--accent-line); background:var(--sunk)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk); color:var(--ink)}
.btn.danger{color:var(--l1); border-color:var(--line)}
.btn.danger:hover{background:var(--l1-bg); border-color:var(--l1)}
.btn.sm{padding:4px 9px; font-size:12.5px}
.btn:disabled{opacity:.45; cursor:not-allowed}

.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px}
.field label{font-size:12.5px; color:var(--ink-2); font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{
  background:var(--card); border:1px solid var(--line); border-radius:7px; padding:8px 10px; width:100%;
}
textarea{resize:vertical; min-height:70px; line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
.inline-f{display:flex; gap:10px; flex-wrap:wrap}
.inline-f .field{flex:1; min-width:150px; margin-bottom:0}

table{width:100%; border-collapse:collapse; font-size:13.5px}
th{text-align:left; font-weight:600; color:var(--ink-2); font-size:12px; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--sunk); white-space:nowrap}
td{padding:11px 14px; border-bottom:1px solid var(--line-2); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sunk)}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

.tag{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px; font-size:11.5px; font-weight:600; border:1px solid transparent; white-space:nowrap}
.tag.l5{background:var(--l5-bg); color:var(--l5)} .tag.l4{background:var(--l4-bg); color:var(--l4)}
.tag.l3{background:var(--l3-bg); color:var(--l3)} .tag.l2{background:var(--l2-bg); color:var(--l2)}
.tag.l1{background:var(--l1-bg); color:var(--l1)}
.tag.plain{background:var(--sunk); color:var(--mute); border-color:var(--line)}
.tag.draft{background:var(--gold-soft); color:var(--gold)}
.tag.ok{background:var(--accent-soft); color:var(--accent)}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; display:inline-block}

.stat{padding:14px 16px}
.stat .k{font-size:12px; color:var(--mute)}
.stat .v{font-family:"Newsreader",Georgia,serif; font-size:2rem; font-weight:500; line-height:1.1; margin-top:2px; font-variant-numeric:tabular-nums}
.stat .f{font-size:12px; color:var(--mute); margin-top:3px}
.meter{height:6px; border-radius:6px; background:var(--line-2); overflow:hidden; margin-top:9px}
.meter i{display:block; height:100%; background:var(--accent); border-radius:6px}
.empty{padding:36px 16px; text-align:center; color:var(--mute)}
.empty b{display:block; color:var(--ink); font-weight:600; margin-bottom:4px; font-size:14.5px}

/* ---------- assessment screen ---------- */
.crit{border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; background:var(--card)}
.crit + .crit{margin-top:12px}
.crit.unrated{border-left:3px solid var(--line)}
.crit.rated{border-left:3px solid var(--accent)}
.crit-h{display:flex; gap:12px; align-items:baseline; flex-wrap:wrap}
.crit-h h3{font-size:14.5px}
.crit-h .w{font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums}
.crit .desc{color:var(--mute); font-size:13px; margin:3px 0 10px; max-width:70ch}
.scale{display:flex; gap:6px; flex-wrap:wrap}
.scale button{
  flex:0 0 auto; width:44px; height:38px; border-radius:7px; border:1px solid var(--line); background:var(--card);
  cursor:pointer; font-weight:600; font-size:15px; color:var(--ink-2);
}
.scale button:hover{border-color:var(--accent); color:var(--accent)}
.scale button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.scale-note{margin-top:8px; font-size:13px; color:var(--ink-2); min-height:19px}
.scale-note b{color:var(--ink)}
.scorebar{
  position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--line); margin:0 -24px -64px;
  padding:12px 24px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; z-index:20;
  box-shadow:0 -6px 20px -18px rgba(0,0,0,.6);
}
.scorebar .big{font-family:"Newsreader",Georgia,serif; font-size:1.9rem; line-height:1; font-variant-numeric:tabular-nums}
.scorebar .lbl{font-size:12px; color:var(--mute)}
.bar-h{height:8px; border-radius:8px; background:var(--line-2); overflow:hidden; min-width:120px; flex:1; max-width:280px}
.bar-h i{display:block; height:100%; background:var(--accent)}

/* ---------- misc ---------- */
.modal-bg{position:fixed; inset:0; background:rgba(12,22,28,.45); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:90; overflow-y:auto}
.modal{background:var(--card); border-radius:12px; width:100%; max-width:540px; border:1px solid var(--line); box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.modal h2{padding:16px 18px; border-bottom:1px solid var(--line-2); font-size:1.05rem}
.modal .mb{padding:18px}
.modal .mf{padding:12px 18px; border-top:1px solid var(--line-2); display:flex; gap:8px; justify-content:flex-end}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:26px; background:var(--nav-bg); color:#fff; padding:10px 16px; border-radius:8px; font-size:13.5px; z-index:120; box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}
.notice{padding:10px 14px; border-radius:8px; font-size:13px; border:1px solid var(--accent-line); background:var(--accent-soft); color:var(--ink)}
.notice.warn{border-color:var(--l2); background:var(--l2-bg); color:var(--l2)}
.notice.bad{border-color:var(--l1); background:var(--l1-bg); color:var(--l1)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--mute)}
svg .gridline{stroke:var(--line-2)}
svg text{fill:var(--mute); font-size:11px; font-family:inherit}
svg text.val{fill:var(--ink); font-weight:600}
.repdoc{background:var(--card); padding:28px; border:1px solid var(--line); border-radius:var(--r)}
.repdoc h1{font-family:"Newsreader",Georgia,serif; font-weight:500}
.repdoc .rh{display:flex; justify-content:space-between; gap:20px; border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:18px; flex-wrap:wrap}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 16px; font-size:13.5px}
.kv dt{color:var(--mute)} .kv dd{margin:0}
.fb{border-left:3px solid var(--accent-line); padding:2px 0 2px 12px; margin:8px 0; font-size:13.5px}
.fb b{display:block; font-size:12px; color:var(--mute); font-weight:600}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .nav{display:none}
  .mobile-nav{display:block; padding:10px 16px; background:var(--nav-bg); position:sticky; top:0; z-index:40}
  .mobile-nav select{background:var(--nav-active); color:#fff; border-color:var(--nav-line)}
  .topbar{padding:10px 16px; top:56px}
  .content{padding:16px 16px 60px}
  .scorebar{margin:0 -16px -60px; padding:12px 16px}
  .g4,.g3,.g2{grid-template-columns:1fr}
  .g4.keep2,.g3.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media print{
  .nav,.topbar,.mobile-nav,.no-print,.scorebar{display:none !important}
  .app{display:block} .content{padding:0; max-width:none}
  .repdoc{border:0; box-shadow:none; padding:0}
  body{background:#fff}
  .card{box-shadow:none; break-inside:avoid}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* =====================================================================
   Classroom Performance Assessment System
   Single-file app. Data lives in the browser (localStorage) and is fully
   configurable at runtime: criteria, weights, rating scale, thresholds.
   ===================================================================== */
"use strict";

/* ---------------- helpers ---------------- */
const $ = (s, r) => (r || document).querySelector(s);
const uid = p => (p || "id") + "_" + Math.random().toString(36).slice(2, 9);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n1 = v => Math.round(v * 10) / 10;
const pct = v => n1(v) + "%";
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => { if (!d) return "—"; const x = new Date(d); return isNaN(x) ? d : x.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" }); };
const fmtDT = d => { if (!d) return "—"; const x = new Date(d); return isNaN(x) ? d : x.toLocaleString(undefined, { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); };
const sum = a => a.reduce((x, y) => x + y, 0);
const avg = a => a.length ? sum(a) / a.length : 0;
const sortBy = (a, f) => a.slice().sort((x, y) => (f(x) > f(y) ? 1 : f(x) < f(y) ? -1 : 0));

/* ---------------- seed data ---------------- */
const DEFAULT_CRITERIA = [
  ["Knowledge & Understanding", "Grasp of the concepts, models and terminology covered in the session.", 20],
  ["Participation & Engagement", "Attention, contribution to discussion and willingness to take part in activities.", 15],
  ["Application of Learning", "Uses the session content in exercises, case work and workplace examples.", 20],
  ["Communication", "Expresses ideas clearly, listens actively and responds to questions.", 15],
  ["Teamwork & Collaboration", "Works constructively with peers and supports the group's progress.", 15],
  ["Professionalism & Attitude", "Punctuality, preparedness, respect for others and openness to feedback.", 15]
];
const DEFAULT_SCALE = {
  max: 5,
  levels: [
    { value: 5, label: "Excellent", description: "Consistently exceeds expectations." },
    { value: 4, label: "Very Good", description: "Frequently exceeds expectations." },
    { value: 3, label: "Meets Expectations", description: "Meets the expected standard." },
    { value: 2, label: "Needs Improvement", description: "Partially meets expectations and requires improvement." },
    { value: 1, label: "Unsatisfactory", description: "Does not meet the expected standard." }
  ]
};
const DEFAULT_THRESHOLDS = [
  { id: "t5", min: 90, label: "Excellent", tone: "l5" },
  { id: "t4", min: 80, label: "Very Good", tone: "l4" },
  { id: "t3", min: 70, label: "Meets Expectations", tone: "l3" },
  { id: "t2", min: 60, label: "Needs Improvement", tone: "l2" },
  { id: "t1", min: 0, label: "Unsatisfactory", tone: "l1" }
];
const ASSESSMENT_TYPES = [
  { id: "classroom", name: "Classroom Performance", active: true },
  { id: "presentation", name: "Presentation Assessment", active: false },
  { id: "practical", name: "Practical Skills Assessment", active: false },
  { id: "leadership", name: "Leadership Assessment", active: false }
];

function seed() {
  const criteria = DEFAULT_CRITERIA.map((c, i) => ({
    id: "c" + (i + 1), typeId: "classroom", name: c[0], description: c[1], weight: c[2], active: true, order: i + 1
  }));
  const courses = [];
  const classes = [];
  const sessions = [];
  const learners = [];
  const users = [
    { id: "u1", name: "Admin", email: "admin@example.org", role: "admin", classIds: [], username: "admin", password: "Admin@2030" }
  ];

  const st = {
    version: 1, org: "Institute of Applied Research & Studies",
    types: ASSESSMENT_TYPES, criteria, courses, classes, sessions, learners, users,
    scale: JSON.parse(JSON.stringify(DEFAULT_SCALE)),
    thresholds: JSON.parse(JSON.stringify(DEFAULT_THRESHOLDS)),
    assessments: [],
    settings: { allowReassessment: false, requireAllRatings: true, theme: "auto" },
    ui: { view: "dashboard", userId: "u1", authedUserId: null, params: {} }
  };

  return st;
}
function sampleComment(r, crit) {
  const m = {
    5: "Outstanding contribution — set the standard for the group.",
    4: "Strong, consistent performance throughout the session.",
    3: "Solid work at the expected standard.",
    2: "Engaged in parts of the session but needs more consistency.",
    1: "Struggled to take part; follow-up support arranged."
  };
  return m[r] + " (" + crit + ")";
}
function snapshotOf(src) {
  return {
    criteria: src.criteria.filter(c => c.active).map(c => ({ id: c.id, name: c.name, description: c.description, weight: c.weight, order: c.order })),
    scale: JSON.parse(JSON.stringify(src.scale)),
    thresholds: JSON.parse(JSON.stringify(src.thresholds))
  };
}

/* ---------------- storage ---------------- */
const KEY = "cpas.v1";
let S = null;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { S = JSON.parse(raw); if (!S.ui) S.ui = { view: "dashboard", userId: "u1", params: {} }; migrateCredentials(); return; }
  } catch (e) { /* storage unavailable — run in memory */ }
  S = seed();
  save();
}
/* users saved before login existed get a generated username and a one-time
   default password so the admin can log in and reissue proper ones */
function migrateCredentials() {
  let changed = false;
  (S.users || []).forEach(u => {
    if (!u.username) { u.username = slugUsername(u.email || u.name); changed = true; }
    if (!u.password) { u.password = "changeme123"; changed = true; }
  });
  if (changed) save();
}
function slugUsername(s) { return String(s).split("@")[0].toLowerCase().replace(/[^a-z0-9.]+/g, ".").replace(/^\.+|\.+$/g, "") || "user"; }
function usernameTaken(name, exceptId) { const n = String(name || "").toLowerCase(); return S.users.some(u => u.id !== exceptId && (u.username || "").toLowerCase() === n); }
function save(skipSync) {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore quota / blocked storage */ }
  if (!skipSync) jbSchedulePush();
}
function resetAll() { S = seed(); save(); render(); toast("Data cleared"); }

/* ---------------- shared storage (JSONBin) ----------------
   Optional. Off by default — everything stays local to this browser exactly
   as before. Once an admin connects a JSONBin.io bin in Settings, every
   change pushes to that bin and every load pulls from it, so anyone opening
   this file (e.g. from GitHub Pages) sees the same live data. */
const JB_KEY = "cpas.jsonbin.v1";
function jbConf() { try { return JSON.parse(localStorage.getItem(JB_KEY) || "null"); } catch (e) { return null; } }
function jbSetConf(c) { try { if (c) localStorage.setItem(JB_KEY, JSON.stringify(c)); else localStorage.removeItem(JB_KEY); } catch (e) {} }
function jbPatchConf(patch) { const c = jbConf(); if (c) jbSetConf(Object.assign({}, c, patch)); }
function jbReady() { const c = jbConf(); return !!(c && c.apiKey && c.binId); }
async function jbPull() {
  const c = jbConf(); if (!c) return null;
  const res = await fetch("https://api.jsonbin.io/v3/b/" + c.binId + "/latest", { headers: { "X-Master-Key": c.apiKey, "X-Bin-Meta": "false" } });
  if (!res.ok) throw new Error("Pull failed (" + res.status + ")");
  return await res.json();
}
async function jbPush(data) {
  const c = jbConf(); if (!c) return false;
  const res = await fetch("https://api.jsonbin.io/v3/b/" + c.binId, { method: "PUT", headers: { "Content-Type": "application/json", "X-Master-Key": c.apiKey }, body: JSON.stringify(data) });
  if (!res.ok) throw new Error("Push failed (" + res.status + ")");
  return true;
}
async function jbCreate(apiKey, data) {
  const res = await fetch("https://api.jsonbin.io/v3/b", { method: "POST", headers: { "Content-Type": "application/json", "X-Master-Key": apiKey, "X-Bin-Name": "classroom-assessment-system" }, body: JSON.stringify(data) });
  if (!res.ok) throw new Error("Could not create a bin (" + res.status + ")");
  const j = await res.json();
  return j && j.metadata && j.metadata.id;
}
let jbPushTimer = null;
function jbSchedulePush() {
  if (!jbReady()) return;
  clearTimeout(jbPushTimer);
  jbPushTimer = setTimeout(function () {
    jbPush(S).then(function () { jbPatchConf({ lastSynced: new Date().toISOString(), lastError: null }); })
             .catch(function (e) { jbPatchConf({ lastError: e.message }); toast("Could not sync to shared storage"); });
  }, 900);
}
function jbPullNow(quiet) {
  if (!jbReady()) { if (!quiet) toast("Shared storage isn't connected yet"); return; }
  jbPull().then(function (remote) {
    if (remote && remote.criteria && remote.users) {
      const localUi = S.ui;
      S = remote; S.ui = localUi;
      save(true);
      jbPatchConf({ lastSynced: new Date().toISOString(), lastError: null });
      render();
      if (!quiet) toast("Pulled the latest shared data");
    } else if (!quiet) toast("The shared bin doesn't look like this app's data");
  }).catch(function (e) {
    jbPatchConf({ lastError: e.message });
    if (!quiet) toast("Could not reach shared storage");
  });
}

const course = id => byId(S.courses, id);
const klass = id => byId(S.classes, id);
const sessionOf = id => byId(S.sessions, id);
const learner = id => byId(S.learners, id);
const user = id => byId(S.users, id);
const me = () => user(S.ui.userId) || S.users[0];
const activeCriteria = () => sortBy(S.criteria.filter(c => c.active), c => c.order);
const totalWeight = () => sum(activeCriteria().map(c => +c.weight || 0));
const sessionsOf = classId => sortBy(S.sessions.filter(s => s.classId === classId), s => s.number);
const learnersOf = classId => S.learners.filter(l => l.classId === classId);

/* visibility by role */
function visibleClasses() {
  const u = me();
  if (u.role === "admin") return S.classes;
  if (u.role === "trainer") return S.classes.filter(c => (u.classIds || []).includes(c.id) || c.trainerId === u.id);
  const L = learner(u.learnerId); return L ? S.classes.filter(c => c.id === L.classId) : [];
}
function visibleLearners() {
  const u = me();
  if (u.role === "learner") { const L = learner(u.learnerId); return L ? [L] : []; }
  const ids = visibleClasses().map(c => c.id);
  return S.learners.filter(l => ids.includes(l.classId));
}
function visibleAssessments() {
  const u = me();
  if (u.role === "learner") return S.assessments.filter(a => a.learnerId === u.learnerId);
  const ids = visibleClasses().map(c => c.id);
  return S.assessments.filter(a => ids.includes(a.classId));
}
const can = what => {
  const r = me().role;
  if (r === "admin") return true;
  if (r === "trainer") return ["assess", "view", "report", "export"].includes(what);
  return what === "viewOwn";
};

/* ---------------- scoring engine ---------------- */
/* Criterion score = rating / maxRating * weight. An assessment that has been
   completed keeps the criteria, weights, scale and thresholds it was marked
   against, so later configuration changes never rewrite history. */
function modelFor(a) {
  if (a && a.snapshot) return a.snapshot;
  return { criteria: activeCriteria().map(c => ({ id: c.id, name: c.name, description: c.description, weight: +c.weight, order: c.order })), scale: S.scale, thresholds: S.thresholds };
}
function scoreOf(a) {
  const m = modelFor(a);
  const max = m.scale.max || 5;
  const rows = m.criteria.map(c => {
    const r = a.ratings && a.ratings[c.id] ? a.ratings[c.id].rating : null;
    const w = +c.weight || 0;
    return { id: c.id, name: c.name, weight: w, rating: r, score: r ? (r / max) * w : 0, maxScore: w };
  });
  const rated = rows.filter(r => r.rating);
  const weightTotal = sum(rows.map(r => r.weight)) || 100;
  const raw = sum(rows.map(r => r.score));
  const percent = weightTotal ? (raw / weightTotal) * 100 : 0;
  const ratedPercent = rated.length ? (sum(rated.map(r => r.score)) / sum(rated.map(r => r.weight))) * 100 : 0;
  return { rows, rated: rated.length, count: rows.length, percent, ratedPercent, raw, weightTotal, complete: rated.length === rows.length && rows.length > 0, level: levelFor(percent, m.thresholds) };
}
function levelFor(p, ths) {
  const list = sortBy(ths || S.thresholds, t => -t.min);
  return list.find(t => p >= t.min) || list[list.length - 1] || { label: "—", tone: "plain" };
}
const levelTag = lv => '<span class="tag ' + esc(lv.tone || "plain") + '"><span class="dot"></span>' + esc(lv.label) + "</span>";
function completedFor(filter) { return visibleAssessments().filter(a => (a.status === "Completed" || a.status === "Reviewed") && (!filter || filter(a))); }

/* Each screen has its own address (#/learners, #/reports?p=...), so the browser
   back button, bookmarks and shared links all behave the way a site should. */
function hashFor(view, params) {
  const p = params && Object.keys(params).length ? "?p=" + encodeURIComponent(JSON.stringify(params)) : "";
  return "#/" + view + p;
}
function writeHash() {
  const target = hashFor(S.ui.view, S.ui.params);
  if (location.hash !== target) location.hash = target;
}
function readHash() {
  const m = /^#\/([A-Za-z0-9_-]+)(?:\?p=(.*))?$/.exec(location.hash || "");
  if (!m) return false;
  S.ui.view = m[1];
  try { S.ui.params = m[2] ? JSON.parse(decodeURIComponent(m[2])) : {}; } catch (e) { S.ui.params = {}; }
  return true;
}
function go(view, params) {
  S.ui.view = view; S.ui.params = params || {};
  save(); writeHash(); render();
  try { window.scrollTo(0, 0); } catch (e) {}
}
window.addEventListener("hashchange", function () {
  /* ignore the echo of our own navigation; act only on back, forward and typed URLs */
  if (location.hash === hashFor(S.ui.view, S.ui.params)) return;
  if (readHash()) { EDIT = null; save(); render(); }
});
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

function renderLogin() {
  $("#app").innerHTML = '<div class="login-shell"><div class="login-card">' +
    '<div class="mark"><span class="dial">◵</span><h1>Performance Assessment</h1></div>' +
    '<div class="sub">' + esc(S.org) + "</div>" +
    (LOGIN_ERROR ? '<div class="notice bad err">' + esc(LOGIN_ERROR) + "</div>" : "") +
    '<form id="loginForm">' +
      '<div class="field"><label for="lg_user">Username</label><input id="lg_user" type="text" autocomplete="username" autocapitalize="none"></div>' +
      '<div class="field"><label for="lg_pass">Password</label><input id="lg_pass" type="password" autocomplete="current-password"></div>' +
      '<button type="submit" class="btn primary" style="width:100%;justify-content:center;margin-top:6px">Sign in</button>' +
    "</form>" +
    '<p class="hint" style="margin-top:16px">Ask your administrator for a username and password.</p>' +
    '<button type="button" class="btn sm ghost" data-act="resetFromLogin" style="margin-top:10px;width:100%;justify-content:center">Forgot the admin password? Reset this browser\'s data</button>' +
    "</div></div>";
  const f = $("#loginForm");
  f.addEventListener("submit", function (ev) { ev.preventDefault(); attemptLogin(); });
  $("#lg_user").focus();
}
function attemptLogin() {
  const name = mval("lg_user"), pass = $("#lg_pass").value;
  const found = S.users.find(u => (u.username || "").toLowerCase() === name.toLowerCase());
  if (!found || found.password !== pass) { LOGIN_ERROR = "That username or password isn't right."; renderLogin(); return; }
  LOGIN_ERROR = null;
  S.ui.authedUserId = found.id; S.ui.userId = found.id; S.ui.view = "dashboard"; S.ui.params = {};
  EDIT = null; save(); writeHash(); render();
}
function logout() {
  S.ui.authedUserId = null; save();
  location.hash = "";
  render();
}


/* ---------------- small components ---------------- */
function pagehead(title, sub, actions) {
  return '<div class="pagehead"><div class="t"><h1>' + esc(title) + "</h1>" + (sub ? "<p>" + esc(sub) + "</p>" : "") + "</div>" + (actions ? '<div class="row no-print">' + actions + "</div>" : "") + "</div>";
}
function stat(k, v, f, meterPct) {
  return '<div class="card stat"><div class="k">' + esc(k) + '</div><div class="v">' + v + "</div>" + (f ? '<div class="f">' + f + "</div>" : "") +
    (meterPct != null ? '<div class="meter"><i style="width:' + Math.max(0, Math.min(100, meterPct)) + '%"></i></div>' : "") + "</div>";
}
function empty(title, msg, action) { return '<div class="empty"><b>' + esc(title) + "</b>" + esc(msg || "") + (action ? '<div style="margin-top:12px">' + action + "</div>" : "") + "</div>"; }
function selectOpts(list, val, labelFn, valFn) {
  return list.map(x => { const v = valFn ? valFn(x) : x.id; return '<option value="' + esc(v) + '"' + (String(v) === String(val) ? " selected" : "") + ">" + esc(labelFn(x)) + "</option>"; }).join("");
}

/* ---------------- charts (inline SVG) ---------------- */
function lineChart(points, opts) {
  opts = opts || {};
  const W = 640, H = 200, pad = { l: 34, r: 14, t: 14, b: 28 };
  if (!points.length) return '<div class="empty">No scored sessions yet.</div>';
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const x = i => pad.l + (points.length === 1 ? iw / 2 : (i * iw) / (points.length - 1));
  const y = v => pad.t + ih - (Math.max(0, Math.min(100, v)) / 100) * ih;
  let grid = "", i;
  for (i = 0; i <= 4; i++) { const v = i * 25, yy = y(v); grid += '<line class="gridline" x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + yy + '" y2="' + yy + '" /><text x="' + (pad.l - 7) + '" y="' + (yy + 4) + '" text-anchor="end">' + v + "</text>"; }
  const path = points.map((p, i2) => (i2 ? "L" : "M") + x(i2) + " " + y(p.v)).join(" ");
  const area = path + " L" + x(points.length - 1) + " " + (pad.t + ih) + " L" + x(0) + " " + (pad.t + ih) + " Z";
  const dots = points.map((p, i2) => '<circle cx="' + x(i2) + '" cy="' + y(p.v) + '" r="4.5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"><title>' + esc(p.label) + ": " + pct(p.v) + "</title></circle>" +
    '<text class="val" x="' + x(i2) + '" y="' + (y(p.v) - 11) + '" text-anchor="middle">' + Math.round(p.v) + "</text>").join("");
  const labels = points.map((p, i2) => '<text x="' + x(i2) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(p.short || p.label) + "</text>").join("");
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '" role="img" aria-label="' + esc(opts.title || "Performance over time") + '">' +
    grid + '<path d="' + area + '" fill="var(--accent-soft)" opacity=".7"/><path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>' + dots + labels + "</svg>";
}
function barRows(rows) {
  if (!rows.length) return '<div class="empty">Nothing to chart yet.</div>';
  return '<div style="display:flex;flex-direction:column;gap:10px">' + rows.map(r => {
    const lv = levelFor(r.v);
    return '<div><div class="row" style="gap:8px;margin-bottom:4px"><span style="font-size:13px">' + esc(r.label) + '</span><span class="spacer"></span><span style="font-size:13px;font-variant-numeric:tabular-nums;font-weight:600">' + pct(r.v) + "</span></div>" +
      '<div class="meter" style="height:9px;margin:0"><i style="width:' + Math.max(1, Math.min(100, r.v)) + "%;background:var(--" + lv.tone + ')"></i></div></div>';
  }).join("") + "</div>";
}
function distributionBar(counts, total) {
  if (!total) return '<div class="empty">No completed assessments yet.</div>';
  const seg = counts.map(c => c.n ? '<div title="' + esc(c.label) + ": " + c.n + '" style="width:' + (c.n / total * 100) + "%;background:var(--" + c.tone + ');height:100%"></div>' : "").join("");
  return '<div style="display:flex;height:16px;border-radius:8px;overflow:hidden;border:1px solid var(--line)">' + seg + "</div>" +
    '<div class="legend" style="margin-top:10px">' + counts.map(c => '<span><span class="dot" style="color:var(--' + c.tone + ')"></span> ' + esc(c.label) + " · " + c.n + "</span>").join("") + "</div>";
}

/* ---------------- views registry ---------------- */
const VIEWS = {};

/* ============ DASHBOARD ============ */
VIEWS.dashboard = function () {
  const u = me();
  if (u.role === "learner") return learnerDashboard(u.learnerId, true);
  const classes = visibleClasses();
  const ls = visibleLearners();
  const done = completedFor();
  const scores = done.map(a => scoreOf(a).percent);
  const classIds = classes.map(c => c.id);
  const allSessions = S.sessions.filter(s => classIds.includes(s.classId));
  const expected = ls.length * (classes.length ? allSessions.length / classes.length : 0);
  const assessedLearners = new Set(done.map(a => a.learnerId)).size;
  const drafts = visibleAssessments().filter(a => a.status === "Draft" || a.status === "In Progress");
  const needSupport = ls.map(L => ({ L, s: avg(completedFor(a => a.learnerId === L.id).map(a => scoreOf(a).percent)) }))
    .filter(x => x.s > 0).sort((a, b) => a.s - b.s);
  const top = needSupport.slice().reverse().slice(0, 4);
  const counts = S.thresholds.map(t => ({ label: t.label, tone: t.tone, n: done.filter(a => levelFor(scoreOf(a).percent).label === t.label).length }));
  const critRows = activeCriteria().map(c => {
    const vals = done.map(a => { const r = a.ratings[c.id]; const m = modelFor(a); return r ? (r.rating / (m.scale.max || 5)) * 100 : null; }).filter(v => v != null);
    return { label: c.name, v: avg(vals) };
  }).sort((a, b) => b.v - a.v);
  const recent = sortBy(done, a => a.submittedAt || a.updatedAt).reverse().slice(0, 6);

  return pagehead(u.role === "admin" ? "Programme overview" : "Your classes",
    u.role === "admin" ? "Live position across every course, class and session you administer." : "Progress across the classes assigned to you.",
    '<button class="btn primary" data-act="nav" data-view="assessments" data-params=\'{"mode":"new"}\'>Start an assessment</button>') +
    '<div class="grid g4 keep2">' +
      stat("Learners", ls.length, classes.length + " class" + (classes.length === 1 ? "" : "es")) +
      stat("Assessed at least once", assessedLearners, ls.length - assessedLearners + " still to assess", ls.length ? assessedLearners / ls.length * 100 : 0) +
      stat("Average score", scores.length ? pct(avg(scores)) : "—", scores.length ? levelFor(avg(scores)).label : "nothing scored yet", avg(scores)) +
      stat("Completed assessments", done.length, drafts.length + " draft" + (drafts.length === 1 ? "" : "s") + " open") +

function sessionAverageRows(classIds) {
  const rows = [];

/* ============ LEARNER DASHBOARD ============ */
function learnerDashboard(learnerId, isSelf) {
  const L = learner(learnerId);
  if (!L) return empty("Learner not found", "Choose a learner from the Learners page.");
  const cl = klass(L.classId), co = cl ? course(cl.courseId) : null;
  const done = sortBy(S.assessments.filter(a => a.learnerId === L.id && (a.status === "Completed" || a.status === "Reviewed")), a => (sessionOf(a.sessionId) || {}).number || 0);
  const scores = done.map(a => scoreOf(a).percent);
  const sessAll = cl ? sessionsOf(cl.id) : [];
  const trend = scores.length > 1 ? scores[scores.length - 1] - scores[0] : 0;
  const points = done.map(a => { const s = sessionOf(a.sessionId); return { label: s ? s.title : a.date, short: s ? "S" + s.number : "", v: scoreOf(a).percent }; });
  const critRows = (activeCriteria()).map(c => {
    const vals = done.map(a => { const r = a.ratings[c.id]; return r ? (r.rating / (modelFor(a).scale.max || 5)) * 100 : null; }).filter(v => v != null);
    return { label: c.name, v: avg(vals), n: vals.length };
  }).filter(r => r.n).sort((a, b) => b.v - a.v);
  const weakest = critRows.slice(-2);
  const overall = avg(scores);

  return pagehead(isSelf ? "Your performance" : L.name, (co ? co.title : "") + (cl ? " · " + cl.name : ""),
    (can("report") ? '<button class="btn" data-act="nav" data-view="reports" data-params=\'{"kind":"learner","id":"' + L.id + '"}\'>Open report</button>' : "") +
    (can("assess") && !isSelf ? ' <button class="btn primary" data-act="newFor" data-id="' + L.id + '">Assess this learner</button>' : "")) +
    '<div class="grid g4 keep2">' +
      stat("Overall score", scores.length ? pct(overall) : "—", scores.length ? levelFor(overall).label : "not yet assessed", overall) +
      stat("Sessions assessed", done.length + " of " + sessAll.length, sessAll.length - done.length + " outstanding", sessAll.length ? done.length / sessAll.length * 100 : 0) +
      stat("Highest / lowest", scores.length ? pct(Math.max.apply(null, scores)) + " / " + pct(Math.min.apply(null, scores)) : "—", "across assessed sessions") +
      stat("Trend", (trend > 0 ? "▲ " : trend < 0 ? "▼ " : "— ") + (scores.length > 1 ? n1(Math.abs(trend)) + " pts" : "n/a"), scores.length > 1 ? "first to latest session" : "needs two sessions") +
    "</div>" +
    '<div class="grid g2" style="margin-top:16px">' +
      '<div class="card"><div class="card-h"><h2>Performance over the programme</h2></div><div class="card-b">' + lineChart(points) + "</div></div>" +
      '<div class="card"><div class="card-h"><h2>Performance by criterion</h2></div><div class="card-b">' + barRows(critRows) +
        (weakest.length ? '<div class="notice warn" style="margin-top:14px">Focus area' + (weakest.length > 1 ? "s" : "") + ": " + esc(weakest.map(w => w.label).join(", ")) + "</div>" : "") + "</div></div>" +
    "</div>" +
    '<div class="card"><div class="card-h"><h2>Session history</h2></div><div class="card-b tight"><div class="tablewrap"><table><thead><tr><th>Session</th><th>Date</th><th>Assessor</th><th class="num">Score</th><th>Performance</th><th></th></tr></thead><tbody>' +
      (sessAll.length ? sessAll.map(s => {
        const a = done.find(x => x.sessionId === s.id);
        if (!a) return '<tr><td>S' + s.number + " · " + esc(s.title) + "</td><td>" + fmtDate(s.date) + '</td><td colspan="3"><span class="tag plain">Not yet assessed</span></td><td></td></tr>';
        const sc = scoreOf(a);
        return "<tr><td>S" + s.number + " · " + esc(s.title) + "</td><td>" + fmtDate(a.date) + "</td><td>" + esc((user(a.assessorId) || {}).name || "—") + '</td><td class="num"><b>' + pct(sc.percent) + "</b></td><td>" + levelTag(sc.level) + '</td><td class="num"><button class="btn sm" data-act="openA" data-id="' + a.id + '">View</button></td></tr>';
      }).join("") : '<tr><td colspan="6">' + empty("No sessions scheduled", "") + "</td></tr>") +
    "</tbody></table></div></div></div>" +

/* ---- CSV import: First name, Last name, Grade, Class ---- */
function parseCSV(text) {
  text = String(text || "").replace(/^\ufeff/, "");
  const rows = []; let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { /* ignore, \n handles the break */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c || "").trim() !== ""));
}
function importLearnersFromCSV(text) {
  const rows = parseCSV(text);
  if (!rows.length) { toast("That file is empty"); return; }
  let start = 0;
  const head = (rows[0] || []).map(c => String(c || "").trim().toLowerCase());
  if (["first name", "firstname", "first"].includes(head[0] || "")) start = 1;
  let added = 0; const skipped = [];
  rows.slice(start).forEach((r, idx) => {
    const rowNum = start + idx + 1;
    const first = String(r[0] || "").trim(), last = String(r[1] || "").trim(),
          grade = String(r[2] || "").trim(), className = String(r[3] || "").trim();
    if (!first && !last && !className) return;
    if (!first || !last) { skipped.push("Row " + rowNum + ": missing first or last name"); return; }
    const fullName = first + " " + last;
    if (!className) { skipped.push("Row " + rowNum + " (" + fullName + "): no class given"); return; }
    const cls = S.classes.find(c => c.name.trim().toLowerCase() === className.toLowerCase());
    if (!cls) { skipped.push("Row " + rowNum + " (" + fullName + "): class \"" + className + "\" not found"); return; }
    const dup = S.learners.find(l => l.classId === cls.id && l.name.trim().toLowerCase() === fullName.toLowerCase());
    if (dup) { skipped.push("Row " + rowNum + " (" + fullName + "): already in " + cls.name); return; }
    S.learners.push({ id: uid("L"), name: fullName, ref: "", email: "", classId: cls.id, org: "", grade: grade });
    added++;
  });
  save(); render();
  const summary = added + " learner" + (added === 1 ? "" : "s") + " added" + (skipped.length ? ", " + skipped.length + " skipped" : "");
  if (skipped.length) {
    openModal("Import results", "<p>" + esc(summary) + "</p><div class=\"hint\" style=\"max-height:240px;overflow:auto;white-space:pre-wrap\">" + esc(skipped.join("\n")) + "</div>", () => closeModal(), "Close");
  } else toast(summary);
}

          return "<tr><td>" + s.number + "</td><td><b>" + esc(s.title) + "</b></td><td>" + fmtDate(s.date) + '</td><td class="num">' + done.length + " / " + ls.length + '</td><td class="num">' + (done.length ? pct(av) : "—") + "</td><td>" + (done.length ? levelTag(levelFor(av)) : '<span class="tag plain">Pending</span>') + "</td>" +
            '<td class="num"><button class="btn sm" data-act="nav" data-view="reports" data-params=\'{"kind":"session","id":"' + s.id + '"}\'>Report</button>' + (can("assess") ? ' <button class="btn sm primary" data-act="sessionAssess" data-id="' + s.id + '">Assess</button>' : "") + (can("edit") ? ' <button class="btn sm ghost" data-act="sessionEdit" data-id="' + s.id + '">Edit</button> <button class="btn sm danger" data-act="sessionDel" data-id="' + s.id + '">Remove</button>' : "") + "</td></tr>";
        }).join("") : '<tr><td colspan="7">' + empty("No sessions", "Add the first session for this class.") + "</td></tr>") +
        "</tbody></table></div></div></div>";
    }).join("") : '<div class="card"><div class="card-b">' + empty("No classes", "Create a class before scheduling sessions.") + "</div></div>");
};
function sessionEdit(id) {

  if (!id && s.classId) s.number = sessionsOf(s.classId).length + 1;

      if (id) Object.assign(s, data); else S.sessions.push(Object.assign({ id: uid("s") }, data));

}

/* ============ ASSESSMENTS: LIST ============ */
VIEWS.assessments = function () {

  if (p.mode === "view") return assessmentView(p.id);

  if (f.classId) list = list.filter(a => a.classId === f.classId);

  if (f.learnerId) list = list.filter(a => a.learnerId === f.learnerId);
  if (f.status) list = list.filter(a => a.status === f.status);

  if (f.from) list = list.filter(a => a.date >= f.from);

      '<select data-act="f" data-k="classId" style="max-width:190px"><option value="">All classes</option>' + selectOpts(cls, f.classId, x => x.name) + "</select>" +
      '<select data-act="f" data-k="sessionId" style="max-width:190px"><option value="">All sessions</option>' + selectOpts(sess, f.sessionId, x => "S" + x.number + " · " + x.title) + "</select>" +
      '<select data-act="f" data-k="learnerId" style="max-width:180px"><option value="">All learners</option>' + selectOpts(lrn, f.learnerId, x => x.name) + "</select>" +
      '<select data-act="f" data-k="status" style="max-width:150px"><option value="">Any status</option>' + ["Draft", "In Progress", "Completed", "Reviewed"].map(s => '<option value="' + s + '"' + (f.status === s ? " selected" : "") + ">" + s + "</option>").join("") + "</select>" +
      '<select data-act="f" data-k="level" style="max-width:180px"><option value="">Any level</option>' + S.thresholds.map(t => '<option value="' + esc(t.label) + '"' + (f.level === t.label ? " selected" : "") + ">" + esc(t.label) + "</option>").join("") + "</select>" +
      '<input type="date" data-act="f" data-k="from" value="' + esc(f.from || "") + '" style="max-width:150px" title="From date">' +
      '<input type="date" data-act="f" data-k="to" value="' + esc(f.to || "") + '" style="max-width:150px" title="To date">' +
      '<button class="btn sm ghost" data-act="clearF">Clear</button><span class="spacer"></span><span class="hint">' + list.length + " record" + (list.length === 1 ? "" : "s") + "</span></div>" +
    '<div class="card-b tight"><div class="tablewrap"><table><thead><tr><th>Learner</th><th>Class</th><th>Session</th><th>Date</th><th>Status</th><th class="num">Score</th><th>Performance</th><th></th></tr></thead><tbody>' +
    (list.length ? list.map(a => {
      const sc = scoreOf(a), s = sessionOf(a.sessionId);
      const statusTag = a.status === "Completed" ? '<span class="tag ok">Completed</span>' : a.status === "Reviewed" ? '<span class="tag l4">Reviewed</span>' : '<span class="tag draft">' + esc(a.status) + " · " + sc.rated + "/" + sc.count + "</span>";
      return "<tr><td><b>" + esc((learner(a.learnerId) || {}).name || "—") + "</b></td><td>" + esc((klass(a.classId) || {}).name || "—") + "</td><td>" + esc(s ? "S" + s.number + " · " + s.title : "—") + "</td><td>" + fmtDate(a.date) + "</td><td>" + statusTag + '</td><td class="num"><b>' + (sc.rated ? pct(sc.percent) : "—") + "</b></td><td>" + (sc.rated ? levelTag(sc.level) : '<span class="tag plain">—</span>') + "</td>" +
        '<td class="num"><button class="btn sm" data-act="openA" data-id="' + a.id + '">Open</button>' + (can("assess") ? ' <button class="btn sm ghost" data-act="editA" data-id="' + a.id + '">' + (a.status === "Draft" || a.status === "In Progress" ? "Continue" : "Reopen") + "</button>" : "") + "</td></tr>";
    }).join("") : '<tr><td colspan="8">' + empty("No assessments match", "Adjust the filters, or start a new assessment.") + "</td></tr>") +
    "</tbody></table></div></div></div>";
};

/* ============ ASSESSMENTS: EDITOR ============ */
let EDIT = null;
function startNew(prefill) {
  const cls = visibleClasses();
  const classId = (prefill && prefill.classId) || (cls[0] || {}).id || "";
  const ss = classId ? sessionsOf(classId) : [];
  const ls = classId ? learnersOf(classId) : [];
  EDIT = {
    id: null, typeId: "classroom", classId,
    courseId: (klass(classId) || {}).courseId || "",
    sessionId: (prefill && prefill.sessionId) || (ss[0] || {}).id || "",
    learnerId: (prefill && prefill.learnerId) || (ls[0] || {}).id || "",
    assessorId: me().id, date: today(), status: "Draft",
    ratings: {}, strengths: "", improvements: "", actions: "", feedback: "", snapshot: null,
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), submittedAt: null
  };
  syncDate();
  loadExisting();
}
function syncDate() { const s = sessionOf(EDIT.sessionId); if (s && s.date) EDIT.date = s.date; }
function loadExisting() {
  /* pick up an unfinished draft for this learner and session, never a submitted one */
  const found = S.assessments.find(a => a.learnerId === EDIT.learnerId && a.sessionId === EDIT.sessionId && (a.status === "Draft" || a.status === "In Progress"));
  if (found) EDIT = JSON.parse(JSON.stringify(found));
}
function assessmentEditor(p) {
  if (p.mode === "edit" && (!EDIT || EDIT.id !== p.id)) { const a = byId(S.assessments, p.id); if (!a) return empty("Assessment not found", ""); EDIT = JSON.parse(JSON.stringify(a)); }
  if (p.mode === "new" && !EDIT) startNew(p.prefill);
  const cls = visibleClasses();
  const ss = sessionsOf(EDIT.classId), ls = learnersOf(EDIT.classId);
  const m = modelFor(EDIT.snapshot ? EDIT : null);
  const crits = (EDIT.status === "Completed" || EDIT.status === "Reviewed") && EDIT.snapshot ? EDIT.snapshot.criteria : activeCriteria();
  const scale = m.scale;
  const wTotal = sum(crits.map(c => +c.weight || 0));
  const dup = S.assessments.find(a => a.id !== EDIT.id && a.learnerId === EDIT.learnerId && a.sessionId === EDIT.sessionId && (a.status === "Completed" || a.status === "Reviewed"));
  const locked = (EDIT.status === "Completed" || EDIT.status === "Reviewed") && !can("edit");

  const head = '<div class="card"><div class="card-h"><h2>Who is being assessed</h2><span class="hint">' + esc(EDIT.status) + (EDIT.id ? " · saved " + fmtDT(EDIT.updatedAt) : " · not saved yet") + "</span></div><div class=\"card-b\">" +
    '<div class="inline-f">' +
      sel("e_class", "Class", selectOpts(cls, EDIT.classId, x => (course(x.courseId) || {}).code + " — " + x.name)) +
      sel("e_session", "Session", ss.length ? selectOpts(ss, EDIT.sessionId, x => "Session " + x.number + " · " + x.title) : '<option value="">No sessions</option>') +
      sel("e_learner", "Learner", ls.length ? selectOpts(ls, EDIT.learnerId, x => x.name + " (" + x.ref + ")") : '<option value="">No learners</option>') +
      fld("e_date", "Date", EDIT.date, "date") +
    "</div></div></div>";

  const warnings = [];
  if (Math.abs(wTotal - 100) > 0.01) warnings.push('<div class="notice warn">Active criteria weights total ' + n1(wTotal) + "%, not 100%. Scores are normalised against the total, but an administrator should fix the weights on the Assessment criteria page.</div>");
  if (dup && !S.settings.allowReassessment) warnings.push('<div class="notice bad">This learner already has a completed assessment for this session, so it cannot be submitted again — reassessment is switched off in Settings. <button class="btn sm" data-act="openA" data-id="' + dup.id + '">Open the existing record</button></div>');
  else if (dup) warnings.push('<div class="notice warn">A completed assessment already exists for this learner and session. Submitting will add a second record. <button class="btn sm" data-act="openA" data-id="' + dup.id + '">Open the existing record</button></div>');
  if (locked) warnings.push('<div class="notice">This assessment is submitted and read-only. An administrator can reopen it.</div>');

  const body = crits.map(c => {
    const r = EDIT.ratings[c.id] || {};
    const lvl = r.rating ? scaleLevel(scale, r.rating) : null;
    return '<div class="crit ' + (r.rating ? "rated" : "unrated") + '" id="crit_' + c.id + '">' +
      '<div class="crit-h"><h3>' + esc(c.name) + '</h3><span class="spacer"></span><span class="w">Weight ' + n1(c.weight) + "%</span></div>" +
      '<div class="desc">' + esc(c.description || "") + "</div>" +
      '<div class="scale" role="group" aria-label="Rating for ' + esc(c.name) + '">' +
        sortBy(scale.levels, l => l.value).map(l => '<button type="button" data-act="rate" data-c="' + c.id + '" data-v="' + l.value + '" aria-pressed="' + (+r.rating === +l.value) + '"' + (locked ? " disabled" : "") + ' title="' + esc(l.label + " — " + l.description) + '">' + l.value + "</button>").join("") +
      "</div>" +
      '<div class="scale-note" id="note_' + c.id + '">' + (lvl ? "<b>" + lvl.value + " — " + esc(lvl.label) + "</b> · " + esc(lvl.description) : '<span class="hint">Select a rating to see the descriptor.</span>') + "</div>" +
      '<div class="field" style="margin:10px 0 0"><label for="cm_' + c.id + '">Assessor comment</label><textarea id="cm_' + c.id + '" data-act="comment" data-c="' + c.id + '" style="min-height:52px" placeholder="What you observed"' + (locked ? " disabled" : "") + ">" + esc(r.comment || "") + "</textarea></div>" +
    "</div>";
  }).join("");

  const fb = '<div class="card"><div class="card-h"><h2>Feedback</h2></div><div class="card-b">' +
    area("e_strengths", "Strengths", EDIT.strengths, "What the learner did well") +
    area("e_improvements", "Areas for improvement", EDIT.improvements, "What needs to develop") +
    area("e_actions", "Recommended actions", EDIT.actions, "Development activities or follow-up") +
    area("e_feedback", "Overall trainer feedback (optional)", EDIT.feedback, "") + "</div></div>";

  return pagehead(EDIT.id ? "Edit assessment" : "New assessment",
    "Rate each criterion, add what you saw, and the score builds as you go.",
    '<button class="btn ghost" data-act="nav" data-view="assessments">Back to list</button>') +
    warnings.join("") + head +
    '<div class="card"><div class="card-h"><h2>Performance criteria</h2><span class="hint">Rating ÷ ' + (scale.max || 5) + " × weight</span></div><div class=\"card-b\">" + (crits.length ? body : empty("No active criteria", "An administrator needs to activate at least one criterion.")) + "</div></div>" +
    fb + scorebar(locked);
}
function scorebar(locked) {
  const sc = scoreOf(EDIT);
  const allowSubmit = !locked && sc.count > 0;
  return '<div class="scorebar no-print" id="scorebar">' +
    '<div><div class="lbl">Total score</div><div class="big" id="sb_pct">' + pct(sc.percent) + "</div></div>" +
    '<div style="min-width:170px"><div class="lbl">Overall performance</div><div id="sb_level" style="margin-top:4px">' + levelTag(sc.level) + "</div></div>" +
    '<div class="bar-h" title="Weighted score"><i id="sb_bar" style="width:' + Math.min(100, sc.percent) + '%"></i></div>' +
    '<div><div class="lbl">Criteria rated</div><div id="sb_rated" style="font-weight:600">' + sc.rated + " of " + sc.count + "</div></div>" +
    '<span class="spacer"></span>' +
    (locked ? '<button class="btn" data-act="printA">Print</button>' :
      '<button class="btn" data-act="saveDraft">Save draft</button><button class="btn primary" data-act="submitA"' + (allowSubmit ? "" : " disabled") + ">Submit assessment</button>") +
    "</div>";
}
function refreshScore() {
  const sc = scoreOf(EDIT);
  const p = $("#sb_pct"); if (!p) return;
  p.textContent = pct(sc.percent);
  $("#sb_level").innerHTML = levelTag(sc.level);
  $("#sb_bar").style.width = Math.min(100, sc.percent) + "%";
  $("#sb_rated").textContent = sc.rated + " of " + sc.count;
}
function stashFeedback() {
  if (!EDIT) return;
  ["strengths", "improvements", "actions", "feedback"].forEach(k => { const e = $("#e_" + k); if (e) EDIT[k] = e.value; });
}
function persistEdit(status) {
  stashFeedback();
  const sc = scoreOf(EDIT);
  EDIT.status = status;
  EDIT.updatedAt = new Date().toISOString();
  EDIT.assessorId = EDIT.assessorId || me().id;
  EDIT.courseId = (klass(EDIT.classId) || {}).courseId || EDIT.courseId;
  if (status === "Completed") {
    EDIT.submittedAt = new Date().toISOString();
    EDIT.assessorId = me().id;
    if (!EDIT.snapshot) EDIT.snapshot = snapshotOf({ criteria: S.criteria, scale: S.scale, thresholds: S.thresholds });
  }
  if (status === "Draft" && sc.rated > 0 && sc.rated < sc.count) EDIT.status = "In Progress";
  if (!EDIT.id) { EDIT.id = uid("a"); EDIT.createdAt = new Date().toISOString(); S.assessments.push(JSON.parse(JSON.stringify(EDIT))); }
  else { const i = S.assessments.findIndex(a => a.id === EDIT.id); if (i >= 0) S.assessments[i] = JSON.parse(JSON.stringify(EDIT)); else S.assessments.push(JSON.parse(JSON.stringify(EDIT))); }
  save();
}
function submitAssessment() {
  stashFeedback();
  const sc = scoreOf(EDIT);
  if (!EDIT.learnerId || !EDIT.sessionId) return toast("Choose a class, session and learner first");
  if (S.settings.requireAllRatings && !sc.complete) {
    const missing = sc.rows.filter(r => !r.rating).map(r => r.name);
    return openModal("Ratings missing", '<p>Every criterion needs a rating before this assessment can be submitted.</p><p class="hint">Still to rate: ' + esc(missing.join(", ")) + "</p>", () => closeModal(), "Back to the form");
  }
  const dup = S.assessments.find(a => a.id !== EDIT.id && a.learnerId === EDIT.learnerId && a.sessionId === EDIT.sessionId && (a.status === "Completed" || a.status === "Reviewed"));
  if (dup && !S.settings.allowReassessment) return toast("A completed assessment already exists for this learner and session");
  const L = learner(EDIT.learnerId), ses = sessionOf(EDIT.sessionId);
  openModal("Submit this assessment?",
    '<p>' + esc(L ? L.name : "") + " — " + esc(ses ? "Session " + ses.number + ": " + ses.title : "") + "</p>" +
    '<div class="row" style="gap:20px;margin:12px 0"><div><div class="hint">Total score</div><b style="font-size:1.4rem">' + pct(sc.percent) + "</b></div><div><div class=\"hint\">Overall performance</div>" + levelTag(sc.level) + "</div></div>" +
    '<p class="hint">Once submitted the record becomes read-only and keeps the criteria and weights used today. Later changes to the criteria will not alter it.</p>',
    () => { persistEdit("Completed"); const id = EDIT.id; EDIT = null; closeModal(); go("assessments", { mode: "view", id }); toast("Assessment submitted"); },
    "Submit");
}

/* ============ ASSESSMENTS: READ-ONLY VIEW ============ */
function assessmentView(id) {
  const a = byId(S.assessments, id);
  if (!a) return empty("Assessment not found", "");
  const sc = scoreOf(a), m = modelFor(a), L = learner(a.learnerId), s = sessionOf(a.sessionId), cl = klass(a.classId), co = course(a.courseId);
  return pagehead("Assessment record", (L ? L.name : "") + " · " + (s ? "Session " + s.number + " — " + s.title : ""),
    '<button class="btn ghost" data-act="nav" data-view="assessments">Back to list</button>' +
    (can("assess") ? '<button class="btn" data-act="editA" data-id="' + a.id + '">' + (a.status === "Completed" || a.status === "Reviewed" ? "Reopen" : "Continue") + "</button>" : "") +
    (can("edit") && a.status === "Completed" ? '<button class="btn" data-act="markReviewed" data-id="' + a.id + '">Mark reviewed</button>' : "") +
    '<button class="btn primary" data-act="pdfAssessment" data-id="' + a.id + '">Download PDF</button>') +
    '<div class="grid g4 keep2">' +
      stat("Total score", pct(sc.percent), "weighted across " + sc.count + " criteria", sc.percent) +
      stat("Performance", sc.level.label, "threshold " + levelFor(sc.percent).min + "% and above") +
      stat("Status", a.status, a.submittedAt ? "submitted " + fmtDT(a.submittedAt) : "last saved " + fmtDT(a.updatedAt)) +
      stat("Assessor", (user(a.assessorId) || {}).name || "—", fmtDate(a.date)) +

function critEdit(id) {
  const c = id ? byId(S.criteria, id) : { name: "", description: "", weight: 10, active: true, order: S.criteria.length + 1, typeId: "classroom" };
  openModal(id ? "Edit criterion" : "Add criterion",
    fld("f_name", "Criterion name", c.name) + area("f_desc", "Description shown to the assessor", c.description) +
    '<div class="inline-f">' + fld("f_weight", "Weight (%)", c.weight, "number", 'min="0" max="100" step="1"') + fld("f_order", "Display order", c.order, "number", 'min="1"') + "</div>" +
    '<label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input type="checkbox" id="f_active"' + (c.active ? " checked" : "") + ' style="width:auto"> Active — include in new assessments</label>',
    () => {
      if (!mval("f_name")) return toast("A criterion needs a name");
      const data = { name: mval("f_name"), description: mval("f_desc"), weight: +mval("f_weight") || 0, order: +mval("f_order") || 1, active: mchk("f_active") };
      if (id) Object.assign(c, data); else S.criteria.push(Object.assign({ id: uid("c"), typeId: "classroom" }, data));
      save(); closeModal(); render(); toast(id ? "Criterion updated" : "Criterion added");
    });

function normaliseWeights() {
  const act = activeCriteria(); if (!act.length) return;
  const each = Math.floor(100 / act.length), rem = 100 - each * act.length;
  act.forEach((c, i) => c.weight = each + (i < rem ? 1 : 0));
  save(); render(); toast("Weights balanced to 100%");
}

/* ============ ANALYTICS ============ */
VIEWS.analytics = function () {
  const cls = visibleClasses();
  const done = completedFor();
  const critRows = activeCriteria().map(c => {
    const vals = done.map(a => { const r = a.ratings[c.id]; return r ? (r.rating / (modelFor(a).scale.max || 5)) * 100 : null; }).filter(v => v != null);
    return { label: c.name, v: avg(vals), n: vals.length };
  }).filter(r => r.n).sort((a, b) => b.v - a.v);
  const classRows = cls.map(c => ({ label: c.name, v: avg(completedFor(a => a.classId === c.id).map(a => scoreOf(a).percent)) })).filter(r => r.v);
  const counts = S.thresholds.map(t => ({ label: t.label, tone: t.tone, n: done.filter(a => levelFor(scoreOf(a).percent).label === t.label).length }));
  const movers = visibleLearners().map(L => {
    const hs = sortBy(completedFor(a => a.learnerId === L.id), a => (sessionOf(a.sessionId) || {}).number || 0).map(a => scoreOf(a).percent);
    return { L, delta: hs.length > 1 ? hs[hs.length - 1] - hs[0] : null, n: hs.length, last: hs[hs.length - 1] };
  }).filter(x => x.delta != null).sort((a, b) => b.delta - a.delta);

  return pagehead("Analytics", "Where the cohort is strong, where it is not, and who is moving.") +
    '<div class="grid g2">' +
      '<div class="card"><div class="card-h"><h2>Criterion performance</h2></div><div class="card-b">' + barRows(critRows) +
        (critRows.length ? '<div class="hint" style="margin-top:14px">Strongest: ' + esc(critRows[0].label) + " · weakest: " + esc(critRows[critRows.length - 1].label) + "</div>" : "") + "</div></div>" +
      '<div class="card"><div class="card-h"><h2>Class comparison</h2></div><div class="card-b">' + barRows(classRows) +
        '<div style="margin-top:18px"><h3 style="font-size:13px;margin-bottom:10px">Performance spread</h3>' + distributionBar(counts, done.length) + "</div></div></div>" +
    "</div>" +
    '<div class="card" style="margin-top:16px"><div class="card-h"><h2>Cohort trend by session</h2></div><div class="card-b">' +
      cls.map(c => {
        const pts = sessionsOf(c.id).map(s => { const d = completedFor(a => a.sessionId === s.id); return d.length ? { label: s.title, short: "S" + s.number, v: avg(d.map(a => scoreOf(a).percent)) } : null; }).filter(Boolean);
        return '<div style="margin-bottom:18px"><h3 style="font-size:13.5px;margin-bottom:8px">' + esc(c.name) + "</h3>" + lineChart(pts) + "</div>";
      }).join("") + "</div></div>" +
    '<div class="card"><div class="card-h"><h2>Biggest movers</h2><span class="hint">first to latest assessed session</span></div><div class="card-b tight"><div class="tablewrap"><table><thead><tr><th>Learner</th><th>Class</th><th class="num">Sessions</th><th class="num">Latest</th><th class="num">Change</th></tr></thead><tbody>' +
      (movers.length ? movers.map(x => '<tr><td>' + esc(x.L.name) + "</td><td>" + esc((klass(x.L.classId) || {}).name) + '</td><td class="num">' + x.n + '</td><td class="num">' + pct(x.last) + '</td><td class="num" style="color:var(--' + (x.delta >= 0 ? "l5" : "l1") + ');font-weight:600">' + (x.delta >= 0 ? "▲ +" : "▼ ") + n1(x.delta) + "</td></tr>").join("") : '<tr><td colspan="5">' + empty("Not enough history", "Two assessed sessions are needed to show a trend.") + "</td></tr>") +
    "</tbody></table></div></div></div>";
};

function repHead(title, sub, meta) {
  return '<div class="rh"><div><h1 style="font-size:1.5rem">' + esc(title) + '</h1><div class="hint">' + esc(sub) + '</div></div><div style="text-align:right"><div style="font-weight:600">' + esc(S.org) + '</div><div class="hint">' + esc(meta) + "</div></div></div>";
}
function learnerReportHTML(id) {
  const L = learner(id); if (!L) return '<div class="repdoc">' + empty("Pick a learner", "") + "</div>";
  const cl = klass(L.classId), co = cl ? course(cl.courseId) : null;
  const done = sortBy(S.assessments.filter(a => a.learnerId === L.id && (a.status === "Completed" || a.status === "Reviewed")), a => (sessionOf(a.sessionId) || {}).number || 0);
  const scores = done.map(a => scoreOf(a).percent);
  const overall = avg(scores);
  const sessAll = cl ? sessionsOf(cl.id) : [];
  const critRows = activeCriteria().map(c => {
    const vals = done.map(a => { const r = a.ratings[c.id]; return r ? (r.rating / (modelFor(a).scale.max || 5)) * 100 : null; }).filter(v => v != null);
    return { label: c.name, v: avg(vals), n: vals.length };
  }).filter(r => r.n);
  const weak = critRows.slice().sort((a, b) => a.v - b.v).slice(0, 2);
  return '<div class="repdoc">' + repHead("Individual learner report", L.name + " · " + (L.ref || ""), "Generated " + fmtDate(today())) +
    '<dl class="kv" style="margin-bottom:18px"><dt>Course</dt><dd>' + esc(co ? co.code + " — " + co.title : "—") + "</dd><dt>Class</dt><dd>" + esc(cl ? cl.name : "—") + "</dd><dt>Employer</dt><dd>" + esc(L.org || "—") + "</dd><dt>Sessions assessed</dt><dd>" + done.length + " of " + sessAll.length + "</dd></dl>" +
    '<div class="grid g4 keep2" style="margin-bottom:18px">' +
      stat("Overall", scores.length ? pct(overall) : "—", levelFor(overall).label) +
      stat("Average", scores.length ? pct(avg(scores)) : "—", "across assessed sessions") +

    const url = URL.createObjectURL(blob);

}

      inp.click(); break; }
    case "learnerImportCSV": { if (!can("edit")) break; const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".csv,text/csv";
      inp.onchange = () => { const f = inp.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => importLearnersFromCSV(rd.result); rd.onerror = () => toast("Could not read that file"); rd.readAsText(f); };
      inp.click(); break; }
    case "reset": confirmDo("Clear all data?", "Everything currently stored in this browser is removed, leaving only the admin login.", resetAll, "Clear"); break;
    case "resetFromLogin": confirmDo("Reset this browser's data?", "This clears every course, class, learner and assessment saved in this browser, leaving only the default admin login (admin / Admin@2030). Do this only if you're locked out and have nothing here worth keeping.", resetAll, "Reset and start over"); break;
    case "clearF": go("assessments", {}); break;
    case "jbSave": { const key = mval("jb_key"), bin = mval("jb_bin");
      if (!key) { toast("Paste your API key first"); break; }
      if (!bin) { toast("Set a bin ID, or use \"Create a new bin\" instead"); break; }
      jbSetConf({ apiKey: key, binId: bin, lastSynced: null, lastError: null }); render(); toast("Connected — pulling the shared data…"); jbPullNow(); break; }
    case "jbCreateBin": { const key = mval("jb_key"); if (!key) { toast("Paste your API key first"); break; }
      toast("Creating a bin…");
      jbCreate(key, S).then(function (id) {
        if (!id) throw new Error("No bin ID returned");
        jbSetConf({ apiKey: key, binId: id, lastSynced: new Date().toISOString(), lastError: null });
        render(); toast("Bin created and connected — copy the Bin ID somewhere safe");
      }).catch(function (e) { toast("Could not create a bin: " + e.message); });
      break; }
    case "jbPullBtn": jbPullNow(); break;
    case "jbPushBtn": if (!jbReady()) { toast("Shared storage isn't connected yet"); break; }
      toast("Pushing…"); jbPush(S).then(function () { jbPatchConf({ lastSynced: new Date().toISOString(), lastError: null }); render(); toast("Pushed to shared storage"); })
        .catch(function (e) { jbPatchConf({ lastError: e.message }); toast("Could not push: " + e.message); }); break;
    case "jbDisconnect": confirmDo("Disconnect shared storage?", "This device stops syncing and goes back to using its own local copy. Nothing is deleted from the bin.", function () { jbSetConf(null); render(); toast("Disconnected"); }, "Disconnect"); break;
    case "closeModal": case "modalbg": closeModal(); break;
    case "saveModal": if (MODAL && MODAL.onSave) MODAL.onSave(); break;
  }
});
document.addEventListener("change", function (ev) {
  const el = ev.target, act = el.getAttribute && el.getAttribute("data-act"), id = el.getAttribute && el.getAttribute("data-id");
  if (act === "navsel") { go(el.value, {}); return; }
  if (el.id && el.id.indexOf("e_") === 0 && EDIT) {
    stashFeedback();
    if (el.id === "e_class") { EDIT.classId = el.value; const ss = sessionsOf(el.value), ls = learnersOf(el.value); EDIT.sessionId = (ss[0] || {}).id || ""; EDIT.learnerId = (ls[0] || {}).id || ""; EDIT.courseId = (klass(el.value) || {}).courseId || ""; EDIT.id = null; EDIT.ratings = {}; EDIT.snapshot = null; syncDate(); loadExisting(); render(); return; }
    if (el.id === "e_session") { EDIT.sessionId = el.value; EDIT.id = null; EDIT.ratings = {}; EDIT.snapshot = null; syncDate(); loadExisting(); render(); return; }
    if (el.id === "e_learner") { EDIT.learnerId = el.value; EDIT.id = null; EDIT.ratings = {}; EDIT.snapshot = null; loadExisting(); render(); return; }
    if (el.id === "e_date") { EDIT.date = el.value; return; }
    return;
  }
  if (act === "f") { const p = S.ui.params || {}; const f = Object.assign({}, p.filters); f[el.getAttribute("data-k")] = el.value; if (el.getAttribute("data-k") === "classId") { f.sessionId = ""; f.learnerId = ""; } go("assessments", { filters: f }); return; }
  if (act === "filterClass") { go("learners", Object.assign({}, S.ui.params, { classId: el.value })); return; }
  if (act === "repKind") { go("reports", { kind: el.value }); return; }
  if (act === "repId") { go("reports", { kind: (S.ui.params || {}).kind || "class", id: el.value }); return; }
  if (act === "critWeight") { const c = byId(S.criteria, id); c.weight = Math.max(0, +el.value || 0); save(); render(); return; }
  if (act === "scaleLabel" || act === "scaleDesc") { const lv = scaleLevel(S.scale, el.getAttribute("data-v")); if (lv) { lv[act === "scaleLabel" ? "label" : "description"] = el.value; save(); } return; }
  if (act === "thLabel") { const th = byId(S.thresholds, id); th.label = el.value; save(); render(); return; }
  if (act === "thMin") { const th = byId(S.thresholds, id); th.min = Math.max(0, Math.min(100, +el.value || 0)); save(); render(); return; }
  if (act === "setOrg") { S.org = el.value; save(); render(); return; }
  if (act === "setReassess") { S.settings.allowReassessment = el.checked; save(); return; }
  if (act === "setRequire") { S.settings.requireAllRatings = el.checked; save(); return; }
});
document.addEventListener("input", function (ev) {
  const el = ev.target, act = el.getAttribute && el.getAttribute("data-act");
  if (act === "comment" && EDIT) { const c = el.getAttribute("data-c"); EDIT.ratings[c] = Object.assign({}, EDIT.ratings[c], { comment: el.value }); return; }
  if (act === "qLearner") { clearTimeout(window.__q); const v = el.value; window.__q = setTimeout(() => { S.ui.params = Object.assign({}, S.ui.params, { q: v }); save(); render(); const q = document.getElementById("q_learner"); if (q) { q.focus(); q.setSelectionRange(v.length, v.length); } }, 260); return; }
});
document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && MODAL) closeModal(); });

/* ============ INIT ============ */
function applyTheme() {
  const t = (S.settings && S.settings.theme) || "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}
load();
VIEWS.learnerDash = () => learnerDashboard((S.ui.params || {}).id, false);
applyTheme();
if (!readHash()) writeHash();
render();
if (jbReady()) jbPullNow(true);
window.addEventListener("focus", function () { if (jbReady()) jbPullNow(true); });
</script>
